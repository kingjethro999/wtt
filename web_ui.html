<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wtt — Web To Text & HTML Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: 'Amazon Ember';
      src: url('/fonts/AmazonEmber_Rg.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bookerly';
      src: url('/fonts/Bookerly-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 21, 37, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --font-brand: 'Amazon Ember', 'Outfit', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-brand);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .brand-title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .label-icon {
      width: 18px;
      height: 18px;
      stroke: #818cf8;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper svg {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      stroke: #6b7280;
      pointer-events: none;
    }
    .input-wrapper input {
      width: 100%;
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: var(--font-brand);
      outline: none;
      transition: all 0.2s ease;
    }
    .input-wrapper input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    .format-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .format-btn {
      background: rgba(10, 15, 29, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      font-family: var(--font-brand);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    .format-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }
    .format-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #fff;
    }
    .format-btn.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: #6366f1;
      color: #a5b4fc;
      font-weight: 600;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .checkbox-group span {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-brand);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.25s ease;
    }
    .btn-submit svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--accent-glow);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Progress Steps Tracker */
    .progress-container {
      display: none;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1.25rem;
    }
    .progress-steps {
      display: flex;
      justify-content: space-between;
      position: relative;
    }
    .progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      z-index: 1;
    }
    .step-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #111827;
      border: 2px solid #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .progress-step.active .step-icon {
      border-color: #6366f1;
      background: #6366f1;
      color: #fff;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.6);
    }
    .progress-step.completed .step-icon {
      border-color: var(--success);
      background: var(--success);
      color: #fff;
    }
    .progress-step.active span {
      color: #fff;
      font-weight: 600;
    }

    /* Output Card */
    .output-card {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.85rem;
    }
    .file-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .preview-box {
      background: #070a12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem;
      max-height: 350px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #d1d5db;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .actions-bar {
      display: flex;
      gap: 0.75rem;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.65rem 1.1rem;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: var(--font-brand);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .btn-secondary svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="brand-title">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: #a855f7;">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        wtt Converter
      </h1>
      <p>Convert websites, Single-Page Applications & Swagger UI docs locally</p>
    </div>

    <div class="card">
      <form id="convertForm">
        <div class="form-group">
          <label for="url">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            Target Website / OpenAPI URL
          </label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <input type="url" id="url" placeholder="https://example.com or Swagger URL fragment..." required>
          </div>
        </div>

        <div class="form-group">
          <label>
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Output Format
          </label>
          <div class="format-selector">
            <button type="button" class="format-btn active" data-fmt="md">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              Markdown
            </button>
            <button type="button" class="format-btn" data-fmt="json">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              JSON
            </button>
            <button type="button" class="format-btn" data-fmt="html">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
              HTML
            </button>
            <button type="button" class="format-btn" data-fmt="txt">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="6"></line>
                <line x1="18" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="18" x2="6" y2="18"></line>
              </svg>
              Text
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="targetPath">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            Destination Folder / Path
          </label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <input type="text" id="targetPath" placeholder="Hit Enter for current directory..." value="">
          </div>
        </div>

        <label class="checkbox-group">
          <input type="checkbox" id="forceJs">
          <span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: #a855f7;">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            Force Playwright Headless Chromium JS rendering
          </span>
        </label>

        <button type="submit" class="btn-submit" id="submitBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>Convert & Save Output</span>
        </button>
      </form>

      <!-- Progress Steps Tracker -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-steps">
          <div class="progress-step active" id="step1">
            <div class="step-icon">1</div>
            <span>Fetch URL</span>
          </div>
          <div class="progress-step" id="step2">
            <div class="step-icon">2</div>
            <span>Auto-Parse</span>
          </div>
          <div class="progress-step" id="step3">
            <div class="step-icon">3</div>
            <span>Format</span>
          </div>
          <div class="progress-step" id="step4">
            <div class="step-icon">4</div>
            <span>Saved</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Output Card -->
    <div class="card output-card" id="outputCard">
      <div class="output-header">
        <div>
          <h3 id="outputTitle">File Saved Successfully!</h3>
          <p id="outputFilePath" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;"></p>
        </div>
        <div class="file-badge" id="fileBadge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Saved
        </div>
      </div>

      <div class="preview-box" id="previewBox">Content preview will appear here...</div>

      <div class="actions-bar">
        <button class="btn-secondary" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy Content
        </button>
      </div>
    </div>
  </div>

  <script>
    let selectedFormat = "md";

    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.fmt;
      });
    });

    const form = document.getElementById('convertForm');
    const submitBtn = document.getElementById('submitBtn');
    const progressContainer = document.getElementById('progressContainer');
    const outputCard = document.getElementById('outputCard');
    const previewBox = document.getElementById('previewBox');
    const outputFilePath = document.getElementById('outputFilePath');
    const fileBadge = document.getElementById('fileBadge');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value.trim();
      const targetPath = document.getElementById('targetPath').value.trim() || ".";
      const forceJs = document.getElementById('forceJs').checked;

      if (!url) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner"></div><span>Processing...</span>';
      progressContainer.style.display = 'flex';
      outputCard.style.display = 'none';

      setStep(1);

      try {
        setTimeout(() => setStep(2), 600);
        setTimeout(() => setStep(3), 1200);

        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format: selectedFormat, path: targetPath, force_js: forceJs })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          setStep(4);
          outputCard.style.display = 'flex';
          outputFilePath.textContent = `Path: ${data.file_path}`;
          previewBox.textContent = data.preview;
          fileBadge.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Saved (${data.size_kb} KB)`;
        } else {
          alert(`❌ Conversion error: ${data.error || 'Failed to convert website'}`);
        }
      } catch (err) {
        alert(`❌ Request error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg><span>Convert & Save Output</span>';
      }
    });

    function setStep(stepNum) {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`step${i}`);
        if (i < stepNum) {
          el.className = 'progress-step completed';
        } else if (i === stepNum) {
          el.className = 'progress-step active';
        } else {
          el.className = 'progress-step';
        }
      }
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(previewBox.textContent);
      copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
      setTimeout(() => {
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Content';
      }, 2000);
    });
  </script>
</body>
</html>
